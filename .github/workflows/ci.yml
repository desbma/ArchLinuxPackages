on: [push, pull_request]

jobs:
  list-packages:
    runs-on: ubuntu-latest
    outputs:
      pkgnames: ${{ steps.list.outputs.pkgnames }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: echo "pkgnames=$(jq -cn '$ARGS.positional | map(ltrimstr("./") | rtrimstr("/PKGBUILD"))' --args ./*/PKGBUILD)" >> "${GITHUB_OUTPUT}"

  package:
    needs: list-packages
    name: ${{ matrix.pkgname }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkgname: ${{ fromJSON(needs.list-packages.outputs.pkgnames) }}
        include:
          - pkgname: bdf
            command: "bdf -h"
          - pkgname: bpm-tools
            command: "bpm -h"
          - pkgname: check-broken-packages-pacman-hook-git
            command: "check-broken-packages"
          - pkgname: cyanrip
            command: "cyanrip -h"
          - pkgname: hddfancontrol
            command: "hddfancontrol -h"
          - pkgname: imgur-uploader-git
            command: "imgur -h"
          - pkgname: mgcarpet
            # usage is printed with exit code 2
            command: "mgcarpet --help || [ $? -eq 2 ]"
          - pkgname: motd
            command: "motd -h"
          - pkgname: rsop-open
            command: "rsop-open -h"
          - pkgname: sacad
            command: "sacad -h && sacad_r -h"
          - pkgname: shh
            command: "shh -h"
          - pkgname: sysstat-mail-report-git
            command: "sysstat-mail-report -h"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: 2m/arch-pkgbuild-builder@1e857b7a8cd3e37b29898833363bab7e621cdd7b # v1.21
        with:
          target: srcinfo
          pkgname: ${{ matrix.pkgname }}
      - uses: 2m/arch-pkgbuild-builder@1e857b7a8cd3e37b29898833363bab7e621cdd7b # v1.21
        with:
          target: pkgbuild
          pkgname: ${{ matrix.pkgname }}
      - if: matrix.command
        uses: 2m/arch-pkgbuild-builder@1e857b7a8cd3e37b29898833363bab7e621cdd7b # v1.21
        with:
          target: run
          pkgname: ${{ matrix.pkgname }}
          command: ${{ matrix.command }}
